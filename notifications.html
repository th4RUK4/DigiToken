<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiToken - Notifications</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <style>
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .notif-row {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr auto;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
            font-size: 0.9rem;
        }

        .notif-row:last-child {
            border-bottom: none;
        }

        @media (max-width: 600px) {
            .notif-row {
                grid-template-columns: 1fr auto;
            }
        }
    </style>
</head>

<body class="dashboard-page">
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand" data-back>
            <span style="font-size: 1.2rem;">←</span> Back
        </a>
        <div style="font-weight: 600;">Notification History</div>
        <button id="theme-toggle" class="theme-toggle"></button>
    </nav>

    <div class="container" style="padding-top: 80px;">
        <div id="notif-status" class="status-banner" hidden></div>

        <div class="card space-y-4">
            <div class="filter-bar">
                <input id="filter-token" type="text" placeholder="Search Token (e.g., A-014)" class="input-field"
                    style="max-width: 200px;">
                <select id="filter-channel" class="input-field" style="max-width: 150px;">
                    <option value="all">All Channels</option>
                    <option value="browser">Browser</option>
                    <option value="email">Email</option>
                    <option value="whatsapp">WhatsApp</option>
                </select>
                <select id="filter-status" class="input-field" style="max-width: 150px;">
                    <option value="all">All Status</option>
                    <option value="delivered">Delivered</option>
                    <option value="failed">Failed</option>
                </select>
            </div>

            <div
                style="background: var(--bg-color); padding: 10px 15px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; color: var(--text-muted); display: grid; grid-template-columns: 1fr 2fr 1fr auto; gap: 10px;">
                <div>Token</div>
                <div>Channel & Message</div>
                <div>Date</div>
                <div>Status</div>
            </div>

            <div id="notif-list" class="notif-list"></div>
            <div id="notif-count" style="text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--text-muted);"></div>
        </div>
    </div>

    <nav class="dashboard-bottom-nav" aria-label="Dashboard navigation">
        <a class="dashboard-nav-item" href="dashboard.html">
            <span class="dashboard-nav-icon" aria-hidden="true">🏠</span>
            <span>Home</span>
        </a>
        <a class="dashboard-nav-item active" href="notifications.html" aria-current="page">
            <span class="dashboard-nav-icon" aria-hidden="true">🔔</span>
            <span>Alerts</span>
        </a>
        <a class="dashboard-nav-item" href="help.html">
            <span class="dashboard-nav-icon" aria-hidden="true">💡</span>
            <span>How it works</span>
        </a>
        <a class="dashboard-nav-item" href="profile.html">
            <span class="dashboard-nav-icon" aria-hidden="true">👤</span>
            <span>Profile</span>
        </a>
    </nav>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        const { apiRequest: apiFetch, requireAuth, subscribeEvents, showStatus: showMessage } = window.DigiTokenApi;
        let notifications = [];

        function channelLabel(channel) {
            if (channel === 'email') return '📧 Email';
            if (channel === 'whatsapp') return '📱 WhatsApp';
            return '🔔 Browser';
        }

        function formatWhen(iso) {
            if (!iso) return '—';
            const date = new Date(iso);
            return date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function filtered() {
            const tokenQuery = document.getElementById('filter-token').value.trim().toLowerCase();
            const channel = document.getElementById('filter-channel').value;
            const status = document.getElementById('filter-status').value;
            return notifications.filter(item => {
                if (tokenQuery && !(item.tokenId || '').toLowerCase().includes(tokenQuery)) return false;
                if (channel !== 'all' && item.channel !== channel) return false;
                if (status !== 'all' && item.status !== status) return false;
                return true;
            });
        }

        function renderList() {
            const list = document.getElementById('notif-list');
            const rows = filtered();
            if (!rows.length) {
                list.innerHTML = '<p style="padding: 12px; color: var(--text-muted);">No notifications yet.</p>';
                document.getElementById('notif-count').textContent = 'Showing 0 notifications';
                return;
            }

            list.innerHTML = rows.map(item => {
                const ok = item.status !== 'failed';
                const badge = ok
                    ? 'background: rgba(3, 152, 85, 0.1); color: var(--success-color);'
                    : 'background: rgba(220, 38, 38, 0.1); color: var(--error-color);';
                return `<div class="notif-row">
                    <div style="font-weight: 700;">${item.tokenId || '—'}</div>
                    <div>
                        <div>${channelLabel(item.channel)}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${item.message}</div>
                    </div>
                    <div style="color: var(--text-muted); font-size: 0.85rem;">${formatWhen(item.createdAt)}</div>
                    <div>
                        <span style="${badge} padding: 4px 8px; border-radius: 12px; font-size: 0.75rem;">${item.status || 'delivered'}</span>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('notif-count').textContent = `Showing ${rows.length} notification${rows.length === 1 ? '' : 's'}`;
        }

        async function loadNotifications() {
            const data = await apiFetch('/api/notifications');
            notifications = data.notifications || [];
            renderList();
            showMessage(document.getElementById('notif-status'), '');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth();
            if (!user) return;

            ['filter-token', 'filter-channel', 'filter-status'].forEach(id => {
                document.getElementById(id).addEventListener('input', renderList);
                document.getElementById(id).addEventListener('change', renderList);
            });

            try {
                showMessage(document.getElementById('notif-status'), 'Loading notifications…', 'info');
                await loadNotifications();
                subscribeEvents({
                    onNotification: async () => {
                        try {
                            await loadNotifications();
                        } catch (error) {
                            showMessage(document.getElementById('notif-status'), error.message, 'error');
                        }
                    }
                });
            } catch (error) {
                showMessage(document.getElementById('notif-status'), error.message, 'error');
            }
        });
    </script>
</body>

</html>
