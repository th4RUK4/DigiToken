<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiToken - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="dashboard.html" data-back style="color: inherit; display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 1.2rem;">←</span>
                <span>Back</span>
            </a>
        </div>
        <div>
            <span style="font-weight: 600; font-size: 1.1rem; color: var(--text-main);">My Profile</span>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="theme-toggle" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px;">
        <div id="profile-status" class="status-banner" hidden></div>

        <div class="card" style="text-align: center; margin-bottom: 20px;">
            <div id="profile-initials" class="profile-initials"
                style="width: 80px; height: 80px; background: var(--primary-color); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 15px; font-weight: 600;">
                ?
            </div>
            <h2 id="profile-name">—</h2>
            <p id="profile-email" style="color: var(--text-muted);">—</p>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 20px;">Edit Details</h3>
            <form id="profile-form" class="space-y-4">
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: 500; color: var(--text-muted);">First Name</label>
                    <input id="first-name" type="text" class="input-field">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: 500; color: var(--text-muted);">Last Name</label>
                    <input id="last-name" type="text" class="input-field">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: 500; color: var(--text-muted);">Phone Number</label>
                    <input id="phone" type="tel" class="input-field">
                </div>
                <button type="submit" class="btn btn-primary" id="save-profile" style="margin-top: 20px;">Save Changes</button>
            </form>
        </div>

        <div class="space-y-4" style="margin-top: 20px;">
            <button id="logout-btn" class="btn btn-outline"
                style="border-color: var(--error-color); color: var(--error-color);">
                Log Out
            </button>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/profile-ui.js"></script>
    <script>
        const { apiRequest: apiFetch, requireAuth, showStatus: showMessage, initialsFor } = window.DigiTokenApi;
        const profileStatus = document.getElementById('profile-status');

        function paintUser(user) {
            window.DigiTokenProfileUi.paintProfile(user, {
                name: document.getElementById('profile-name'),
                email: document.getElementById('profile-email'),
                initials: document.getElementById('profile-initials'),
                firstName: document.getElementById('first-name'),
                lastName: document.getElementById('last-name'),
                phone: document.getElementById('phone')
            }, initialsFor);
        }

        document.getElementById('profile-form').addEventListener('submit', async event => {
            event.preventDefault();
            const button = document.getElementById('save-profile');
            button.disabled = true;
            showMessage(document.getElementById('profile-status'), 'Saving…', 'info');
            try {
                const data = await apiFetch('/api/auth/profile', {
                    method: 'PATCH',
                    body: {
                        firstName: document.getElementById('first-name').value,
                        lastName: document.getElementById('last-name').value,
                        phone: document.getElementById('phone').value
                    }
                });
                paintUser(data.user);
                showMessage(document.getElementById('profile-status'), 'Profile saved.', 'success');
            } catch (error) {
                showMessage(document.getElementById('profile-status'), error.message, 'error');
            } finally {
                button.disabled = false;
            }
        });

        window.DigiTokenProfileUi.bindLogoutButton(document.getElementById('logout-btn'), {
            apiRequest: apiFetch,
            showStatus: (message, type) => showMessage(profileStatus, message, type),
            navigate: destination => { window.location.href = destination; }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth();
            if (!user) return;
            paintUser(user);
        });
    </script>
</body>

</html>
