<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiToken - Walk-in</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .scanner-frame {
            width: min(100%, 360px);
            height: 300px;
            border: 2px dashed var(--primary-color);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            margin: 20px auto;
        }

        .scanner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .scanner-frame.is-active .scanner-video {
            display: block;
        }

        .scanner-frame.is-active .scanner-message,
        .scanner-frame.is-active .scan-line {
            display: none;
        }

        .scanner-message {
            padding: 20px;
        }

        .scanner-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .scanner-actions .btn {
            width: auto;
            padding: 12px 18px;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
            animation: scan 2s infinite;
        }

        @keyframes scan {
            0% {
                top: 0;
            }

            100% {
                top: 100%;
            }
        }

        .big-token {
            font-size: 5rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 86, 210, 0.3);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">🔹 DigiToken</a>
        <button id="theme-toggle" class="theme-toggle">🌙</button>
    </nav>

    <div class="container flex-center">

        <!-- STEP 1: SCAN -->
        <div id="step-scan" class="flex-col" style="width: 100%; text-align: center;">
            <h2>Scan QR Code</h2>
            <p style="color: var(--text-muted);">Point your camera at the counter QR code.</p>

            <div id="scanner-frame" class="scanner-frame">
                <video id="scanner-video" class="scanner-video" autoplay muted playsinline></video>
                <div class="scan-line"></div>
                <div class="scanner-message">
                    <p id="scanner-status" style="color: var(--text-muted);">Camera is ready to scan.</p>
                    <p style="font-size: 0.8rem; opacity: 0.7;">Allow camera access, then point it at a QR code.</p>
                </div>
            </div>

            <div class="scanner-actions">
                <button id="start-scanner" class="btn btn-primary" type="button">Start Camera</button>
                <button id="stop-scanner" class="btn btn-outline" type="button" hidden>Stop Camera</button>
            </div>
            <button id="simulate-scan" class="btn btn-ghost" type="button" hidden>Use Demo QR</button>
            <a class="btn btn-ghost" href="dashboard.html" data-back>Cancel</a>
        </div>

        <!-- STEP 2: PROCESSING -->
        <div id="step-processing" class="flex-col hidden" style="width: 100%; text-align: center;">
            <div class="flex-center" style="height: 300px;">
                <!-- Simple CSS Loader -->
                <div
                    style="width: 50px; height: 50px; border: 5px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite;">
                </div>
                <style>
                    @keyframes spin {
                        100% {
                            transform: rotate(360deg);
                        }
                    }
                </style>
            </div>
            <h3>Generating Token...</h3>
        </div>

        <!-- STEP 3: TOKEN (MODAL POPUP) -->
        <div id="step-token" class="hidden"
            style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">

            <div class="card"
                style="width: 90%; max-width: 350px; padding: 40px 20px; border: 3px solid var(--success-color); background: var(--surface-color); text-align: center; box-shadow: 0 10px 40px rgba(3, 152, 85, 0.3); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);">

                <!-- Success Icon -->
                <div
                    style="width: 60px; height: 60px; background: var(--success-color); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 20px;">
                    ✓
                </div>

                <h2 style="color: var(--success-color); margin-bottom: 5px;">Token Generated!</h2>
                <p style="font-weight: 600; color: var(--text-muted);">Your Token Number</p>

                <div class="big-token" style="color: var(--success-color); text-shadow: none;">W-99</div>

                <div style="background: rgba(3, 152, 85, 0.1); padding: 10px; border-radius: 8px; margin-top: 20px;">
                    <div style="margin-bottom: 5px; font-size: 1.2rem; color: var(--text-main);">Position:
                        <strong>5th</strong></div>
                    <p style="color: var(--success-color); font-size: 0.9rem; margin: 0; font-weight: 500;">Please wait
                        for your number.</p>
                </div>

                <br>
                <button onclick="window.location.reload()" class="btn btn-primary"
                    style="background-color: var(--success-color); border: none;">Done</button>
            </div>

            <style>
                @keyframes popIn {
                    0% {
                        transform: scale(0.5);
                        opacity: 0;
                    }

                    100% {
                        transform: scale(1);
                        opacity: 1;
                    }
                }
            </style>
        </div>

    </div>

    <script src="assets/js/main.js"></script>
    <script>
        const scannerFrame = document.getElementById('scanner-frame');
        const scannerVideo = document.getElementById('scanner-video');
        const scannerStatus = document.getElementById('scanner-status');
        const startScannerButton = document.getElementById('start-scanner');
        const stopScannerButton = document.getElementById('stop-scanner');
        const simulateScanButton = document.getElementById('simulate-scan');
        let scannerStream;
        let scanAnimationFrame;
        let scannerBusy = false;
        const qrDetector = 'BarcodeDetector' in window
            ? new BarcodeDetector({ formats: ['qr_code'] })
            : null;

        startScannerButton.addEventListener('click', startScanner);
        stopScannerButton.addEventListener('click', stopScanner);
        simulateScanButton.addEventListener('click', () => handleScan('digitoken://counter?service=General%20Enquiry'));

        async function startScanner() {
            if (!('BarcodeDetector' in window)) {
                scannerStatus.innerText = 'QR scanning is not supported in this browser.';
                simulateScanButton.hidden = false;
                return;
            }

            if (!navigator.mediaDevices?.getUserMedia) {
                scannerStatus.innerText = 'Camera access is unavailable. Use the demo QR instead.';
                simulateScanButton.hidden = false;
                return;
            }

            try {
                scannerStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' } },
                    audio: false
                });
                scannerVideo.srcObject = scannerStream;
                scannerFrame.classList.add('is-active');
                startScannerButton.hidden = true;
                stopScannerButton.hidden = false;
                scannerStatus.innerText = 'Scanning for a QR code...';
                scanFrame();
            } catch (error) {
                scannerStatus.innerText = error.name === 'NotAllowedError'
                    ? 'Camera permission was denied. Use the demo QR instead.'
                    : 'Could not start the camera. Use the demo QR instead.';
                simulateScanButton.hidden = false;
            }
        }

        async function scanFrame() {
            if (!scannerStream || scannerBusy) return;
            try {
                const codes = await qrDetector.detect(scannerVideo);
                if (codes.length > 0) {
                    scannerBusy = true;
                    stopScanner();
                    handleScan(codes[0].rawValue);
                    return;
                }
            } catch (error) {
                scannerStatus.innerText = 'Unable to read this QR code. Try again.';
            }
            scanAnimationFrame = requestAnimationFrame(scanFrame);
        }

        function stopScanner() {
            if (scanAnimationFrame) cancelAnimationFrame(scanAnimationFrame);
            scannerStream?.getTracks().forEach(track => track.stop());
            scannerStream = null;
            scannerVideo.srcObject = null;
            scannerFrame.classList.remove('is-active');
            startScannerButton.hidden = false;
            stopScannerButton.hidden = true;
            scannerBusy = false;
        }

        async function handleScan(rawValue) {
            stopScanner();
            document.getElementById('step-scan').classList.add('hidden');
            document.getElementById('step-processing').classList.remove('hidden');
            const service = getServiceFromQr(rawValue);

            try {
                const response = await fetch('/api/tokens', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'walkin', service, channel: 'browser' })
                });
                if (response.ok) {
                    const token = await response.json();
                    document.querySelector('#step-token .big-token').innerText = token.id;
                }
            } catch (error) {
                // Direct file usage keeps the original demo token.
            }

            setTimeout(() => {
                document.getElementById('step-processing').classList.add('hidden');
                document.getElementById('step-token').classList.remove('hidden');
            }, 700);
        }

        function getServiceFromQr(rawValue) {
            try {
                const url = new URL(rawValue);
                return url.searchParams.get('service') || 'General Enquiry';
            } catch (error) {
                return 'General Enquiry';
            }
        }

    </script>
</body>

</html>
