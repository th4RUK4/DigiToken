<!DOCTYPE html>
<html lang="en" data-theme="dark"> <!-- Default to Dark for TV appeal -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiToken - Public Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        :root {
            --display-bg: #07131f;
            --display-panel: #0d2233;
            --display-panel-light: #123149;
            --display-line: rgba(143, 211, 232, 0.2);
            --display-text: #f4fbff;
            --display-muted: #8fb5c5;
            --display-accent: #54d6e8;
            --display-highlight: #ffc857;
        }

        body {
            overflow: hidden;
            /* No scroll for TV */
            background-color: var(--display-bg);
            color: var(--display-text);
            display: flex;
            height: 100vh;
        }

        .split-screen {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .main-panel {
            flex: 2;
            background: linear-gradient(135deg, var(--display-panel-light) 0%, var(--display-bg) 72%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--display-line);
        }

        .side-panel {
            flex: 1;
            background: var(--display-panel);
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        .now-serving-label {
            font-size: 2rem;
            color: var(--display-muted);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .huge-token {
            font-size: 15rem;
            font-weight: 800;
            line-height: 1;
            color: var(--display-accent);
            text-shadow: 0 0 50px rgba(84, 214, 232, 0.38);
            animation: pulse 2s infinite;
        }

        .counter-info {
            font-size: 3rem;
            margin-top: 20px;
            background: var(--display-highlight);
            color: #152331;
            padding: 10px 40px;
            border-radius: 20px;
        }

        .list-header {
            font-size: 1.5rem;
            border-bottom: 2px solid var(--display-line);
            padding-bottom: 20px;
            margin-bottom: 20px;
            color: var(--display-muted);
        }

        .next-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 2.5rem;
            padding: 20px 0;
            border-bottom: 1px solid var(--display-line);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.02);
                opacity: 0.9;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="split-screen">
        <!-- LEFT: NOW SERVING -->
        <div class="main-panel">
            <div class="now-serving-label">Now Serving</div>
            <div class="huge-token">A-14</div>
            <div class="counter-info">Counter 01</div>
        </div>

        <!-- RIGHT: UPCOMING -->
        <div class="side-panel">
            <div class="list-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span>Up Next</span>
                <span
                    style="font-size: 0.8rem; border: 1px solid var(--display-line); padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; gap: 5px;">
                    <span
                        style="display: block; width: 6px; height: 6px; background-color: var(--success-color); border-radius: 50%; box-shadow: 0 0 5px var(--success-color);"></span>
                    Live Updates
                </span>
            </div>

            <div class="next-item">
                <span>A-15</span>
                <div style="text-align: right;">
                    <span style="font-size: 1.5rem; color: var(--display-muted); display: block;">Waiting</span>
                    <span style="font-size: 0.9rem; color: var(--display-muted);">~5 mins</span>
                </div>
            </div>
            <div class="next-item">
                <span>B-09</span>
                <div style="text-align: right;">
                    <span style="font-size: 1.5rem; color: var(--display-muted); display: block;">Waiting</span>
                    <span style="font-size: 0.9rem; color: var(--display-muted);">~12 mins</span>
                </div>
            </div>
            <div class="next-item">
                <span>A-16</span>
                <div style="text-align: right;">
                    <span style="font-size: 1.5rem; color: var(--display-muted); display: block;">Waiting</span>
                    <span style="font-size: 0.9rem; color: var(--display-muted);">~18 mins</span>
                </div>
            </div>

            <div style="margin-top: auto; text-align: center; color: var(--display-muted); opacity: 0.75;">
                <p>DigiToken System</p>
                <div id="clock" style="font-size: 1.5rem; margin-top: 10px;">12:00 PM</div>
            </div>
        </div>
    </div>

    <script>
        // Simple Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);
    </script>
</body>

</html>
