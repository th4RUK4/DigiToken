name: CI

on:
  push:
    branches:
      - main
      - fix/backend
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test
