<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiToken - Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            width: 100%;
            margin: 80px auto 20px;
        }

        .tab-group {
            display: flex;
            margin-bottom: 20px;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 12px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: 0;
            background: transparent;
            font: inherit;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--surface-color);
            color: var(--primary-color);
            box-shadow: var(--shadow-sm);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .auth-field-row {
            display: flex;
            gap: 10px;
        }

        .auth-field-row > .auth-field {
            min-width: 0;
            flex: 1;
        }

        .auth-field label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
        }

        .auth-switch {
            margin-top: 18px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-switch-link {
            border: 0;
            padding: 4px;
            background: transparent;
            color: var(--primary-color);
            font: inherit;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .auth-switch-link:focus-visible,
        .tab:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
        }

        @media (max-width: 420px) {
            .auth-field-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand" data-back>
            <img src="assets/img/logo.png" alt="DigiToken Logo" style="height: 32px;">
            <span style="font-weight: 700; font-size: 1.2rem; color: var(--primary-color);">DigiToken</span>
        </a>
        <button id="theme-toggle" class="theme-toggle">🌙</button>
    </nav>

    <div class="auth-container">
        <div class="card">
            <div id="main-tabs" class="tab-group" role="tablist" aria-label="Account access">
                <button id="tab-login" class="tab active" type="button" data-tab="login" role="tab" aria-controls="view-login" aria-selected="true" tabindex="0" onclick="(function(){document.querySelectorAll('#main-tabs .tab').forEach(tab => {const isActive=tab.dataset.tab==='login'; tab.classList.toggle('active', isActive); tab.setAttribute('aria-selected', String(isActive)); tab.tabIndex = isActive ? 0 : -1;}); document.querySelectorAll('.section').forEach(section => {const isActive = section.id === 'view-login'; section.classList.toggle('active', isActive); section.hidden = !isActive;}); const statusEl = document.getElementById('auth-status'); if (statusEl && window.DigiTokenApi && typeof window.DigiTokenApi.showStatus === 'function') window.DigiTokenApi.showStatus(statusEl, '');})()">Login</button>
                <button id="tab-signup" class="tab" type="button" data-tab="signup" role="tab" aria-controls="view-signup" aria-selected="false" tabindex="-1" onclick="(function(){document.querySelectorAll('#main-tabs .tab').forEach(tab => {const isActive=tab.dataset.tab==='signup'; tab.classList.toggle('active', isActive); tab.setAttribute('aria-selected', String(isActive)); tab.tabIndex = isActive ? 0 : -1;}); document.querySelectorAll('.section').forEach(section => {const isActive = section.id === 'view-signup'; section.classList.toggle('active', isActive); section.hidden = !isActive;}); const statusEl = document.getElementById('auth-status'); if (statusEl && window.DigiTokenApi && typeof window.DigiTokenApi.showStatus === 'function') window.DigiTokenApi.showStatus(statusEl, '');})()">Sign Up</button>
            </div>

            <div id="auth-status" class="status-banner" hidden></div>

            <div id="view-login" class="section active" role="tabpanel" aria-labelledby="tab-login">
                <h2 style="text-align: center; margin-bottom: 1rem;">Welcome Back</h2>

                <form id="login-form" class="space-y-4">
                    <div class="auth-field">
                        <label for="login-email">Email address</label>
                        <input id="login-email" type="email" class="input-field" placeholder="you@example.com" required autocomplete="username">
                    </div>
                    <div class="auth-field">
                        <label for="login-password">Password</label>
                        <input id="login-password" type="password" class="input-field" placeholder="Enter your password" required autocomplete="current-password">
                    </div>

                    <p style="font-size: 0.8rem; color: var(--text-muted);">
                        Password reset via OTP is coming soon. Contact an admin if you need access restored.
                    </p>

                    <button type="submit" class="btn btn-primary" id="login-submit">Login</button>
                </form>
                <p class="auth-switch">New to DigiToken? <button class="auth-switch-link" type="button" data-auth-target="signup" onclick="(function(){document.querySelectorAll('#main-tabs .tab').forEach(tab => {const isActive=tab.dataset.tab==='signup'; tab.classList.toggle('active', isActive); tab.setAttribute('aria-selected', String(isActive)); tab.tabIndex = isActive ? 0 : -1;}); document.querySelectorAll('.section').forEach(section => {const isActive = section.id === 'view-signup'; section.classList.toggle('active', isActive); section.hidden = !isActive;}); const statusEl = document.getElementById('auth-status'); if (statusEl && window.DigiTokenApi && typeof window.DigiTokenApi.showStatus === 'function') window.DigiTokenApi.showStatus(statusEl, '');})()">Create an account</button></p>
            </div>

            <div id="view-signup" class="section" role="tabpanel" aria-labelledby="tab-signup" hidden>
                <h2 style="text-align: center; margin-bottom: 1rem;">Create Account</h2>
                <p style="text-align: center; color: var(--text-muted); margin: -6px 0 20px;">Create a free customer account to book service tokens and track your place in the queue.</p>
                <form id="signup-form" class="space-y-4">
                    <div class="auth-field-row">
                        <div class="auth-field">
                            <label for="signup-first">First name</label>
                            <input id="signup-first" type="text" class="input-field" placeholder="First name" autocomplete="given-name">
                        </div>
                        <div class="auth-field">
                            <label for="signup-last">Last name</label>
                            <input id="signup-last" type="text" class="input-field" placeholder="Last name" autocomplete="family-name">
                        </div>
                    </div>
                    <div class="auth-field">
                        <label for="signup-email">Email address</label>
                        <input id="signup-email" type="email" class="input-field" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="auth-field">
                        <label for="signup-password">Password</label>
                        <input id="signup-password" type="password" class="input-field" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" aria-describedby="signup-password-hint">
                        <small id="signup-password-hint" style="display: block; margin-top: 6px; color: var(--text-muted);">Use at least 6 characters.</small>
                    </div>

                    <button type="submit" class="btn btn-primary" id="signup-submit">Sign Up</button>
                </form>
                <p class="auth-switch">Already have an account? <button class="auth-switch-link" type="button" data-auth-target="login" onclick="(function(){document.querySelectorAll('#main-tabs .tab').forEach(tab => {const isActive=tab.dataset.tab==='login'; tab.classList.toggle('active', isActive); tab.setAttribute('aria-selected', String(isActive)); tab.tabIndex = isActive ? 0 : -1;}); document.querySelectorAll('.section').forEach(section => {const isActive = section.id === 'view-login'; section.classList.toggle('active', isActive); section.hidden = !isActive;}); const statusEl = document.getElementById('auth-status'); if (statusEl && window.DigiTokenApi && typeof window.DigiTokenApi.showStatus === 'function') window.DigiTokenApi.showStatus(statusEl, '');})()">Log in</button></p>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth-ui.js"></script>
    <script>
        const { apiRequest: apiFetch, showStatus: showMessage } = window.DigiTokenApi;
        const statusEl = document.getElementById('auth-status');

        function switchAuthTab(tabName) {
            const activeTab = tabName === 'signup' ? 'signup' : 'login';
            document.querySelectorAll('#main-tabs .tab').forEach(tab => {
                const isActive = tab.dataset.tab === activeTab;
                tab.classList.toggle('active', isActive);
                tab.setAttribute('aria-selected', String(isActive));
                tab.tabIndex = isActive ? 0 : -1;
            });

            document.querySelectorAll('.section').forEach(section => {
                const isActive = section.id === `view-${activeTab}`;
                section.classList.toggle('active', isActive);
                section.hidden = !isActive;
            });

            showMessage(statusEl, '');
        }

        window.switchAuthTab = switchAuthTab;

        const initialTab = new URLSearchParams(window.location.search).get('tab') === 'signup' ? 'signup' : 'login';
        switchAuthTab(initialTab);

        async function redirectIfLoggedIn() {
            try {
                const { user } = await apiFetch('/api/auth/me');
                window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
            } catch {
                // stay on auth page
            }
        }

        document.getElementById('login-form').addEventListener('submit', async event => {
            event.preventDefault();
            const submit = document.getElementById('login-submit');
            submit.disabled = true;
            showMessage(statusEl, 'Signing in…', 'info');
            try {
                const data = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    body: {
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    }
                });
                window.location.href = data.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
            } catch (error) {
                showMessage(statusEl, error.message, 'error');
                submit.disabled = false;
            }
        });

        document.getElementById('signup-form').addEventListener('submit', async event => {
            event.preventDefault();
            const submit = document.getElementById('signup-submit');
            submit.disabled = true;
            showMessage(statusEl, 'Creating account…', 'info');
            try {
                const firstName = document.getElementById('signup-first').value.trim();
                const lastName = document.getElementById('signup-last').value.trim();
                const email = document.getElementById('signup-email').value.trim();
                const password = document.getElementById('signup-password').value;

                await apiFetch('/api/auth/signup', {
                    method: 'POST',
                    body: {
                        firstName,
                        lastName,
                        email,
                        password
                    }
                });

                window.location.href = 'dashboard.html';
            } catch (error) {
                showMessage(statusEl, error.message, 'error');
                submit.disabled = false;
            }
        });

        redirectIfLoggedIn();
    </script>
</body>

</html>
